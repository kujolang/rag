name: Setup pinned Kujo
description: Install and expose the checksum-verified Kujo runtime used by RAG CI.

runs:
  using: composite
  steps:
    - name: Install Kujo v1.2.2
      id: kujo
      uses: kujolang/kujo/.github/actions/setup-kujo@22582e7f0111a1005002579b44f5d03cd2ed1c9c
      with:
        version: v1.2.2

    - name: Export Kujo runtime path
      shell: bash
      env:
        KUJO_SETUP_PATH: ${{ steps.kujo.outputs.kujo-path }}
      run: echo "KUJO_BIN=${KUJO_SETUP_PATH}" >> "$GITHUB_ENV"
