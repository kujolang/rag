name: chaos-fault-injection-review

on:
  schedule:
    - cron: "0 12 * * 3"
  workflow_dispatch:

jobs:
  chaos-fault-injection-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Kujo runtime
        uses: ./.github/actions/setup-kujo

      - name: Verify Kujo runtime
        run: kujo --version

      - name: Run chaos fault-injection review gate
        shell: bash
        run: |
          set -euo pipefail
          kujo run scripts/run_chaos_fault_injection_review.kujo --interpreter > chaos-fault-injection-status.json
          cat chaos-fault-injection-status.json

      - name: Upload chaos fault-injection artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chaos-fault-injection-review
          path: |
            chaos-fault-injection-status.json
            results/reliability/chaos_fault_injection_status.json
            config/chaos_fault_injection_scenarios.json
            docs/chaos-fault-injection-scenarios.md
