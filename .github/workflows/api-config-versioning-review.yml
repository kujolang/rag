name: api-config-versioning-review

on:
  schedule:
    - cron: "0 9 * * 3"
  workflow_dispatch:

jobs:
  api-config-versioning-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KUJO_RUNTIME_REF: "f0b7c6af753ed350e0957c4a873613fb7d88937d"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Kujo runtime
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/kujo-runtime
          git -C /tmp/kujo-runtime remote add origin https://github.com/kujolang/kujo.git
          git -C /tmp/kujo-runtime fetch --depth 1 origin "$KUJO_RUNTIME_REF"
          git -C /tmp/kujo-runtime checkout --detach "$KUJO_RUNTIME_REF"
          cargo build --release --locked --manifest-path /tmp/kujo-runtime/Cargo.toml
          echo "/tmp/kujo-runtime/target/release" >> "$GITHUB_PATH"

      - name: Verify Kujo runtime
        run: kujo --version

      - name: Run API/config versioning policy review gate
        shell: bash
        run: |
          set -euo pipefail
          kujo run scripts/run_api_config_versioning_review.kujo --interpreter > api-config-versioning-status.json
          cat api-config-versioning-status.json

      - name: Upload API/config versioning artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-config-versioning-review
          path: |
            api-config-versioning-status.json
            results/api/api_config_versioning_status.json
            config/api_config_versioning_policy.json
            compatibility/api-config/previous_minor_matrix.json
            docs/api-config-versioning-policy.md
            docs/migrations/README.md
            docs/migrations/v2.0.0-template.md
