name: release-artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.2.3 or v1.2.3)'
        required: true
        type: string
      notes_path:
        description: 'Optional release notes path override'
        required: false
        default: ''
        type: string

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Kujo runtime
        uses: ./.github/actions/setup-kujo

      - name: Resolve release version and notes path
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version_input="${{ inputs.version }}"
            notes_input="${{ inputs.notes_path }}"
          else
            version_input="${GITHUB_REF_NAME}"
            notes_input=""
          fi

          normalized="v${version_input#v}"
          notes_path="${notes_input}"
          if [[ -z "${notes_path}" ]]; then
            notes_path="./docs/releases/${normalized}.md"
          fi

          echo "version_input=${version_input}" >> "$GITHUB_OUTPUT"
          echo "normalized_tag=${normalized}" >> "$GITHUB_OUTPUT"
          echo "notes_path=${notes_path}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          kujo run scripts/build_release_artifacts.kujo --interpreter \
            --version "${{ steps.release_meta.outputs.version_input }}" \
            --notes "${{ steps.release_meta.outputs.notes_path }}" \
            --output-dir ./results/releases > release-artifacts.json
          cat release-artifacts.json

      - name: Verify SBOM artifact is present
        shell: bash
        run: |
          set -euo pipefail
          test -f "results/releases/${{ steps.release_meta.outputs.normalized_tag }}/sbom.cyclonedx.json"

      - name: Run supply-chain scan gate
        shell: bash
        run: |
          set -euo pipefail
          kujo run scripts/run_supply_chain_scan.kujo --interpreter \
            --root .github/workflows/release-gates.yml \
            --output "results/releases/${{ steps.release_meta.outputs.normalized_tag }}/supply-chain-scan-release-gates.json"
          kujo run scripts/run_supply_chain_scan.kujo --interpreter \
            --root .github/workflows/release-artifacts.yml \
            --output "results/releases/${{ steps.release_meta.outputs.normalized_tag }}/supply-chain-scan-release-artifacts.json"
          kujo run scripts/run_supply_chain_scan.kujo --interpreter \
            --root .env.example \
            --output "results/releases/${{ steps.release_meta.outputs.normalized_tag }}/supply-chain-scan-env-surface.json"
          cat "results/releases/${{ steps.release_meta.outputs.normalized_tag }}/supply-chain-scan-release-gates.json"
          cat "results/releases/${{ steps.release_meta.outputs.normalized_tag }}/supply-chain-scan-release-artifacts.json"
          cat "results/releases/${{ steps.release_meta.outputs.normalized_tag }}/supply-chain-scan-env-surface.json"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ steps.release_meta.outputs.normalized_tag }}
          path: |
            release-artifacts.json
            results/releases/${{ steps.release_meta.outputs.normalized_tag }}
