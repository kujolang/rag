name: threat-model-review

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Kujo runtime
        uses: ./.github/actions/setup-kujo

      - name: Verify Kujo runtime
        run: kujo --version

      - name: Run threat model cadence review
        shell: bash
        run: |
          set -euo pipefail
          kujo run scripts/run_threat_model_review_cadence.kujo --interpreter > threat-model-review.json
          cat threat-model-review.json

      - name: Upload threat model review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: threat-model-review
          path: |
            threat-model-review.json
            results/security/threat_model_review_status.json
