name: compliance-evidence-review

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Kujo runtime
        uses: ./.github/actions/setup-kujo

      - name: Verify Kujo runtime
        run: kujo --version

      - name: Run compliance control evidence review
        shell: bash
        run: |
          set -euo pipefail
          kujo run scripts/run_compliance_control_evidence_review.kujo --interpreter > compliance-evidence-review.json
          cat compliance-evidence-review.json

      - name: Upload compliance review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compliance-evidence-review
          path: |
            compliance-evidence-review.json
            results/compliance/compliance_evidence_review.json
