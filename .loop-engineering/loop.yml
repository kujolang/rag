objective: "Audit HLP-011 and HLP-015 RAG configuration and JSON output helpers, replacing pure serialization wrappers while retaining policy-bearing normalization and file helpers."
checklist_file: ""
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: kujo_checks
    command: "for f in main.kujo src/*.kujo scripts/*.kujo tests/test_config_schema_review.kujo tests/test_openapi_contract_sdk.kujo tests/test_architecture_fitness_review.kujo tests/test_performance_cost_budget_review.kujo; do /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo check $f >/dev/null || exit 1; done"
  - id: focused_helper_tests
    command: "KUJO_BIN=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo run tests/test_config_schema_review.kujo --interpreter && KUJO_BIN=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo run tests/test_openapi_contract_sdk.kujo --interpreter"
  - id: diff_check
    command: "git diff --check -- $(git diff --name-only | grep -v '^.loop-engineering/' || true)"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
